# ============================================================
# VEREISTE: PAT_TOKEN secret
# ============================================================
# Deze workflow vereist een Personal Access Token (PAT) met
# 'repo' en 'admin:org' rechten, ingesteld als organisatie-
# level secret onder de naam 'PAT_TOKEN'.
# ============================================================
name: Apply Repository Settings

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-settings:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'init') || contains(github.event.head_commit.message, 'Init')
    runs-on: ubuntu-latest
    steps:
      - name: Apply repository and branch protection settings
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Branch protection instellen op master
            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch: 'master',
              required_status_checks: {
                strict: true,
                contexts: [
                  'Check Broken Links',
                  'Check for Disallowed Links',
                  'Block Non-Plaintext File Formats',
                  'Require mention in markdown'
                ]
              },
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: true,
                require_last_push_approval: true
              },
              enforce_admins: false,
              required_linear_history: true,
              allow_force_pushes: false,
              allow_deletions: false,
              required_conversation_resolution: true,
              restrictions: null
            });
            core.info('✅ Branch protection ingesteld op master');

      - name: Configure repository settings
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Algemene repo instellingen
            await github.rest.repos.update({
              owner,
              repo,
              has_wiki: false,
              has_projects: false,
              allow_squash_merge: true,
              allow_rebase_merge: false,
              allow_merge_commit: true,
              delete_branch_on_merge: true
            });
            core.info('✅ Repository instellingen geconfigureerd');
