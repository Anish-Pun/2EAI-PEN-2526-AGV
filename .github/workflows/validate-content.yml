name: Validate Content

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-broken-links:
    name: Check Broken Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify documentation exists
        id: verify_docs
        run: |
          echo "⏳ Controleren of er markdown documentatie aanwezig is..."
          
          MD_COUNT=$(find . -name "*.md" -type f -not -path "./.git/*" -not -path "./.github/*" | wc -l)
          
          if [ "$MD_COUNT" -eq 0 ]; then
            echo "❌ GEEN markdown documentatie gevonden!"
            echo "has_docs=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ $MD_COUNT markdown bestand(en) gevonden"
          echo "has_docs=true" >> $GITHUB_OUTPUT
          echo "doc_count=$MD_COUNT" >> $GITHUB_OUTPUT

      - name: Comment on PR - Missing documentation
        if: failure() && github.event_name == 'pull_request' && steps.verify_docs.outputs.has_docs == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ❌ Geen documentatie gevonden
            
            Er zijn geen markdown (.md) bestanden gevonden in je repository. **Documentatie is verplicht.**
            
            Voeg minimaal een \`README.md\` toe met:
            - Projectbeschrijving en doel
            - Hardware/software vereisten
            - Installatie en gebruik instructies
            - Auteur en licentie
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Run Linkinator on markdown files
        if: steps.verify_docs.outputs.has_docs == 'true'
        id: linkinator
        uses: JustinBeckwith/linkinator-action@v2
        continue-on-error: true
        with:
          paths: "**/*.md"
          recurse: true
          verbosity: "ERROR"
          concurrency: 10
          timeout: 10000        # 10s per request
          retryErrors: false    # geen retries op 5xx / netwerkfouten
          retry: false          # geen retries op 429

      - name: Comment on PR - Broken links found
        if: steps.linkinator.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ❌ Broken links gevonden
            
            Je documentatie bevat kapotte links. Check de workflow logs voor details.
            
            **Veelvoorkomende oorzaken:**
            - Bestanden bestaan niet op het aangegeven pad
            - Hoofdlettergevoeligheid: \`Image.png\` ≠ \`image.png\`
            - Absolute paden gebruikt in plaats van relatieve paden
            - Verkeerde slashes: gebruik \`/\` niet \`\\\`
            
            **Fix:** Gebruik relatieve paden zoals \`docs/file.pdf\` of \`docs/images/photo.jpg\`
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if linkinator failed
        if: steps.linkinator.outcome == 'failure'
        run: exit 1

  check-external-links:
    name: Check for Disallowed Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for blob links and external media
        id: check_links
        run: |
          echo "⏳ Controleren op absolute of externe links..."
          
          # Escape de repository URL voor gebruik in grep (escape dots en slashes)
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          
          # Check voor blob links - simpele aanpak: zoek gewoon naar github.com + repo + /blob/
          blob_links=$(grep -r --include="*.md" --include="*.html" --include="*.htm" --include="*.txt" \
            "github\.com/${REPO_OWNER}/${REPO_NAME}/blob/" . 2>/dev/null || true)
          
          if [ -n "$blob_links" ]; then
            echo "❌ Blob-links naar eigen repo gevonden:"
            echo "$blob_links"
            echo "has_blob_links=true" >> $GITHUB_OUTPUT
            echo "blob_links<<EOF" >> $GITHUB_OUTPUT
            echo "$blob_links" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

          # Check voor externe media links
          external_media=$(grep -rn --include="*.md" --include="*.html" --include="*.htm" --include="*.txt" \
            -E "https?://" . 2>/dev/null | \
            grep -v "github\.com/${REPO_OWNER}/${REPO_NAME}" | \
            grep -v "localhost" | \
            grep -v "127\.0\.0\.1" | \
            grep -Ei "\.(png|jpe?g|gif|pdf|docx?)" || true)
          
          if [ -n "$external_media" ]; then
            echo "❌ Externe media links gevonden:"
            echo "$external_media"
            echo "has_external_media=true" >> $GITHUB_OUTPUT
            echo "external_media<<EOF" >> $GITHUB_OUTPUT
            echo "$external_media" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          
          # Fail als een van beide gevonden is
          if [ -n "$blob_links" ] || [ -n "$external_media" ]; then
            exit 1
          fi
          
          echo "✅ Geen disallowed links gevonden."

      - name: Comment on PR - Disallowed links found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const hasBlobLinks = '${{ steps.check_links.outputs.has_blob_links }}' === 'true';
            const hasExternalMedia = '${{ steps.check_links.outputs.has_external_media }}' === 'true';
            const blobLinks = `${{ steps.check_links.outputs.blob_links }}`;
            const externalMedia = `${{ steps.check_links.outputs.external_media }}`;
            
            let comment = `## ❌ Verboden links gevonden\n\n`;
            
            if (hasBlobLinks) {
              comment += `### 🔗 Absolute blob links naar eigen repository\n\n`;
              comment += `Gebruik relatieve paden in plaats van absolute GitHub URLs.\n\n`;
              comment += `**Gevonden:**\n\`\`\`\n${blobLinks}\n\`\`\`\n\n`;
              comment += `**Fix:** Vervang \`https://github.com/.../blob/.../file.pdf\` door \`path/to/file.pdf\`\n\n`;
            }
            
            if (hasExternalMedia) {
              comment += `### 🌐 Externe links naar mediabestanden\n\n`;
              comment += `Download externe media (afbeeldingen, PDFs) en plaats ze lokaal in je repository.\n\n`;
              comment += `**Gevonden:**\n\`\`\`\n${externalMedia}\n\`\`\`\n\n`;
              comment += `**Fix:** Download het bestand, plaats in \`docs/\` en link relatief: \`docs/datasheet.pdf\`\n\n`;
            }
            
            comment += `**Waarom?** Externe links kunnen verdwijnen, blob links breken bij forks/renames.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  enforce-plaintext-formats:
    name: Block Non-Plaintext File Formats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for non-text file types
        id: check_files
        run: |
          echo "⏳ Controleren op verboden binaire bestandsformaten..."
          
          forbidden_files=$(find . -type f \( \
            -name "*.docx" -o -name "*.pptx" -o -name "*.xlsx" -o \
            -name "*.doc" -o -name "*.ppt" -o -name "*.xls" -o \
            -name "*.odt" -o -name "*.odp" -o -name "*.ods" -o \
            -name "*.pages" -o -name "*.numbers" -o -name "*.key" -o \
            -name "*.rtf" -o \
            -name "*.zip" -o -name "*.rar" -o -name "*.7z" -o \
            -name "*.tar" -o -name "*.gz" -o -name "*.bz2" -o \
            -name "*.tnzip" -o -name "*.tszip" -o -name "*.tpzip" -o \
            -name "*.psd" -o -name "*.ai" -o -name "*.sketch" -o \
            -name "*.fig" -o -name "*.xcf" -o \
            -name "*.exe" -o -name "*.dll" -o -name "*.so" -o \
            -name "*.dylib" -o -name "*.app" -o -name "*.dmg" -o \
            -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o \
            -name "*.db" -o -name "*.sqlite" -o -name "*.mdb" -o \
            -name "*.accdb" \
          \) -not -path "./.git/*" -not -path "./.github/*") || true
          
          if [ -n "$forbidden_files" ]; then
            echo "❌ Verboden bestanden aangetroffen:"
            echo "$forbidden_files"
            echo "forbidden=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$forbidden_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Geen verboden bestanden gevonden."
          echo "forbidden=false" >> $GITHUB_OUTPUT

      - name: Comment on PR - Forbidden files found
        if: failure() && github.event_name == 'pull_request' && steps.check_files.outputs.forbidden == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.check_files.outputs.files }}`;
            const comment = `## ❌ Verboden bestandsformaten gedetecteerd
            
            GitHub is een samenwerkingsplatform voor **reviewbare code en tekst**, geen bestandsopslag. Binaire bestanden (Word, Excel, PowerPoint, zip) kunnen niet gereviewed worden en zijn niet toegestaan.
            
            **Verboden bestanden:**
            \`\`\`
            ${files}
            \`\`\`
            
            **Wat te gebruiken:**
            - Word/Pages → Markdown (\`.md\`)
            - Excel/Numbers → CSV (\`.csv\`)
            - PowerPoint → Markdown met Marp
            - zip/rar → Gewoon de bestanden direct in de repo
            - Design bestanden → SVG of PNG/JPG export
            
            **Toegestaan zijn WEL:** PDFs (voor datasheets/schemas), afbeeldingen (PNG/JPG/SVG), en alle tekstformaten.
            
            **Fix:** Verwijder met \`git rm <bestand>\`, converteer naar toegestane formaten, commit en push.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
