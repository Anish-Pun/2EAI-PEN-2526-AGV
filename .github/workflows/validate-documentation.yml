name: Require documentation with markdown mention
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  require-markdown-mention:
    name: Require mention in markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check markdown mentions in PR
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request context, exiting.');
              return;
            }
            const prNumber = pr.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = pr.head.sha;
            const baseSha = pr.base.sha;

            // List files in the PR
            const filesResp = await github.rest.pulls.listFiles({ owner, repo, pull_number: prNumber, per_page: 500 });
            const fileList = filesResp.data.map(f => ({ filename: f.filename, status: f.status }));

            const nonMd = fileList.filter(f => /^docs\//i.test(f.filename));

            if (nonMd.length === 0) {
              core.info('No non-markdown files changed.');
              return;
            }

            // Markdown files added/modified in the PR
            const mdFilesInPr = fileList.filter(f => /\.md$/i.test(f.filename)).map(f => f.filename);

            // Also enumerate all markdown files in the base branch (anywhere in repo) using git tree
            const mdFilesInBase = [];
            try {
              const treeResp = await github.rest.git.getTree({ owner, repo, tree_sha: baseSha, recursive: 'true' });
              if (treeResp && treeResp.data && Array.isArray(treeResp.data.tree)) {
                for (const entry of treeResp.data.tree) {
                  if (/\.md$/i.test(entry.path)) mdFilesInBase.push(entry.path);
                }
              }
            } catch (e) {
              core.info('Unable to read repository tree on base branch: ' + e.message);
            }

            const mdFiles = [...new Set([...mdFilesInPr, ...mdFilesInBase])];

            if (mdFiles.length === 0) {
              const message = [
                `Found file(s) changed without any markdown mention in this PR:`,
                ...nonMd.map(f => `- ${f.filename}`),
                '',
                'Policy: add a .md file in this PR that references the file(s) (use the filename or full path), or ensure there is an existing .md in the base branch that references them.',
                'Example: docs/Documentation.md referencing images/diagram.png'
              ].join('\n');
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `### ❌ Markdown mention policy violation\n\n${message}`
              });
              
              core.setFailed(message);
              return;
            }

            // For each markdown file (either in PR or in base), fetch its content at an appropriate ref and search for references
            const satisfied = new Set();
            for (const md of mdFiles) {
              try {
                // Decide which ref to read: if md is in PR files, read from headSha; otherwise from baseSha
                const ref = mdFilesInPr.includes(md) ? headSha : baseSha;
                const contentResp = await github.rest.repos.getContent({ owner, repo, path: md, ref });
                if (!contentResp || !contentResp.data) continue;
                if (Array.isArray(contentResp.data)) continue; // skip directories
                const enc = contentResp.data.encoding;
                const raw = contentResp.data.content || '';
                const content = enc === 'base64' ? Buffer.from(raw, 'base64').toString('utf8') : raw;

                for (const f of nonMd) {
                  const basename = f.filename.split('/').pop();
                  if (content.includes(f.filename) || content.includes(basename)) {
                    satisfied.add(f.filename);
                  }
                }
              } catch (e) {
                core.info(`Failed reading ${md}: ${e.message}`);
              }
            }

            const missing = nonMd.map(f => f.filename).filter(fn => !satisfied.has(fn));
            if (missing.length > 0) {
              const message = [
                `Found file(s) without a markdown mention in this PR:`,
                ...missing.map(m => `- ${m}`),
                '',
                'Policy: References the file(s) (use filename or path) in an markdown (.md) file for better documentation'
              ].join('\n');
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `### ❌ Markdown mention policy violation\n\n${message}`
              });
              
              core.setFailed(message);
            } else {
              core.info('All changed files are referenced from markdown files in this PR or in the base branch.');
            }